# Example only. Main backend may own postgres; avoid starting a duplicate database.
services:
  chatbot-api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_API_URL: ${BACKEND_API_URL}
      BACKEND_SERVICE_TOKEN: ${BACKEND_SERVICE_TOKEN}
    ports:
      - "8001:8000"
    restart: unless-stopped
  # ingestion worker can use the same image with a separate command when implemented
